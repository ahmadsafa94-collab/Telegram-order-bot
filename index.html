<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Medic SalesBot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:   var(--tg-theme-bg-color,#0f1117);
  --bg2:  var(--tg-theme-secondary-bg-color,#1a1d27);
  --text: var(--tg-theme-text-color,#e8eaf0);
  --hint: var(--tg-theme-hint-color,#6b7280);
  --acc:  var(--tg-theme-button-color,#3b82f6);
  --atxt: var(--tg-theme-button-text-color,#fff);
  --teal: #0d9488; --teal2:#14b8a6;
  --red:  #ef4444;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}

/* ── Header ─────────────────── */
.hdr{background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.07);
  position:sticky;top:0;z-index:200}
.hdr-top{display:flex;align-items:center;gap:8px;padding:12px 13px 8px}
.logo{width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal),#0284c7);
  display:flex;align-items:center;justify-content:center;font-size:19px}
.hdr-title{flex:1;min-width:0}
.hdr-title h1{font-size:15px;font-weight:700}
.hdr-title p{font-size:10px;color:var(--hint);margin-top:1px}
.hdr-icons{display:flex;gap:8px;flex-shrink:0}
.ico-btn{
  position:relative;width:40px;height:40px;border-radius:12px;border:none;
  background:rgba(255,255,255,.08);color:var(--text);font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .15s;flex-shrink:0;
}
.ico-btn:active{background:rgba(255,255,255,.15)}
.ico-badge{
  position:absolute;top:-5px;right:-5px;
  background:var(--red);color:#fff;border-radius:99px;
  min-width:17px;height:17px;font-size:10px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
.ico-badge.vis{opacity:1}
.ico-btn.acc{background:var(--acc)}

/* ── Step bar ───────────────── */
.steps{display:flex;padding:8px 13px 10px}
.step{flex:1;text-align:center;position:relative}
.step::after{content:'';position:absolute;top:11px;left:50%;right:-50%;
  height:2px;background:rgba(255,255,255,.09);z-index:0}
.step:last-child::after{display:none}
.step-dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.15);
  background:var(--bg);display:flex;align-items:center;justify-content:center;
  margin:0 auto 3px;font-size:10px;font-weight:700;color:var(--hint);
  position:relative;z-index:1;transition:all .2s}
.step.done .step-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.step.active .step-dot{background:var(--acc);border-color:var(--acc);color:#fff}
.step-lbl{font-size:10px;color:var(--hint);transition:color .2s}
.step.active .step-lbl{color:var(--text)}

/* ── Pages ──────────────────── */
.page{display:none;padding:13px}
.page.on{display:block}

.sl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--hint);margin:13px 0 7px}
.sl:first-child{margin-top:0}

/* ── Catalog tabs ───────────── */
.tabs{display:flex;gap:7px;padding:10px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 12px;border-radius:99px;
  border:1.5px solid rgba(255,255,255,.12);font-size:12px;font-weight:500;
  color:var(--hint);cursor:pointer;background:transparent;transition:all .15s}
.tab.active{border-color:var(--teal);background:rgba(13,148,136,.15);color:var(--teal2)}

/* ── Item rows ──────────────── */
.card{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:none}
.ri{flex:1;min-width:0}
.rn{font-size:13px;font-weight:500;line-height:1.3}
.rs{font-size:11px;color:var(--hint);margin-top:1px}
.rp{font-size:14px;font-weight:700;color:var(--teal2);flex-shrink:0}
.add-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--acc);
  color:var(--atxt);font-size:17px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;margin-left:8px;transition:all .15s}
.add-btn:active{transform:scale(.88)}
.add-btn.in{background:var(--teal)}
.solo{display:flex;align-items:center;gap:10px;padding:11px 13px;
  background:var(--bg2);border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r);margin-bottom:7px}

/* ── Detail forms ───────────── */
.dblock{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.dheader{padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center}
.ptag{margin-left:auto;color:var(--teal2);font-size:13px;font-weight:700;flex-shrink:0}
.toggle{display:flex;border-radius:12px;overflow:hidden;border:1.5px solid rgba(255,255,255,.12);margin:11px 13px 4px}
.tbtn{flex:1;border:none;background:transparent;color:var(--hint);padding:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.tbtn.active{background:var(--acc);color:var(--atxt)}
.fields{padding:0 13px 13px}
.field{margin-top:11px}
.field label{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.field input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);
  border-radius:10px;padding:10px 11px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--acc)}
.field input.err{border-color:var(--red)}
.fhint{font-size:11px;color:var(--hint);margin-top:3px}
.ferr{font-size:11px;color:var(--red);margin-top:3px;display:none}

/* ── Payment ─────────────────── */
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pm{background:var(--bg2);border:2px solid rgba(255,255,255,.08);border-radius:var(--r);
  padding:13px 9px;text-align:center;cursor:pointer;transition:all .15s}
.pm.sel{border-color:var(--acc);background:rgba(59,130,246,.08)}
.pm .ico{font-size:22px;margin-bottom:5px}
.pm .lbl{font-size:11px;font-weight:600}
.pm .sub{font-size:10px;color:var(--hint);margin-top:1px}
.pdtl{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);
  padding:13px;margin-bottom:10px;line-height:1.8;font-size:12px;display:none}
.pdtl.on{display:block}
.pdtl strong{color:var(--teal2)}
.mono{font-family:'SF Mono',Consolas,monospace;background:rgba(255,255,255,.08);
  padding:2px 6px;border-radius:5px;cursor:pointer;user-select:all;transition:background .15s}
.mono:active{background:rgba(13,148,136,.3)}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}
.cb{background:var(--bg2);border:2px solid rgba(255,255,255,.08);
  border-radius:11px;padding:9px;text-align:center;cursor:pointer;font-size:12px;transition:all .15s}
.cb.sel{border-color:var(--acc)}

/* ── Summary ─────────────────── */
.sumrow{display:flex;justify-content:space-between;align-items:center;
  padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.sumrow:last-child{border-bottom:none;font-weight:700;font-size:14px}
.sumrow .r{color:var(--teal2)}

/* ── Buttons ─────────────────── */
.btn{width:100%;background:var(--acc);color:var(--atxt);border:none;
  border-radius:var(--r);padding:13px;font-size:14px;font-weight:700;
  cursor:pointer;transition:opacity .15s;margin-top:8px}
.btn:active{opacity:.82}
.btn.sec{background:transparent;color:var(--hint);border:1.5px solid rgba(255,255,255,.12)}
.btn.teal{background:var(--teal)}

/* ── Slide-up sheets ─────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
  display:none;align-items:flex-end}
.overlay.on{display:flex}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;
  max-height:84vh;overflow-y:auto;padding:0 0 32px}
.sheet-handle{width:38px;height:4px;background:rgba(255,255,255,.18);
  border-radius:99px;margin:10px auto 14px}
.sheet-title{font-size:16px;font-weight:700;padding:0 15px 11px;
  border-bottom:1px solid rgba(255,255,255,.07)}

/* Basket items */
.ci{display:flex;align-items:center;padding:10px 15px;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.ci-name{flex:1;font-size:13px;line-height:1.4}
.ci-price{font-size:13px;font-weight:700;color:var(--teal2);flex-shrink:0}
.rm{width:26px;height:26px;border-radius:50%;border:none;
  background:rgba(239,68,68,.18);color:var(--red);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-total{padding:12px 15px 4px;display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.cart-total span:last-child{color:var(--teal2)}
.empty-sheet{text-align:center;padding:32px 16px;color:var(--hint);font-size:13px}
.empty-sheet .eico{font-size:36px;margin-bottom:10px}

/* Subscription rows */
.sub-row{display:flex;align-items:center;gap:10px;padding:11px 15px;
  border-bottom:1px solid rgba(255,255,255,.05)}
.sub-row:last-child{border-bottom:none}
.sub-info{flex:1;min-width:0}
.sub-name{font-size:13px;font-weight:500}
.sub-meta{font-size:11px;color:var(--hint);margin-top:2px}
.sub-icon{font-size:20px;flex-shrink:0}
.sub-section-lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--hint);padding:10px 15px 4px}

/* ── Toast ───────────────────── */
.toast{position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%) translateY(68px);
  background:rgba(13,148,136,.92);color:#fff;padding:8px 15px;
  border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);z-index:999;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-top">
    <div class="logo">🏥</div>
    <div class="hdr-title">
      <h1 id="hdrTitle">Medic SalesBot</h1>
      <p>Medical Subscription Store</p>
    </div>
    <div class="hdr-icons">
      <button class="ico-btn" title="My Subscriptions" onclick="openOrders()">
        📋<div class="ico-badge vis" id="subsBadge" style="display:none">!</div>
      </button>
      <button class="ico-btn acc" title="Basket" onclick="openBasket()">
        🧺<div class="ico-badge" id="bc">0</div>
      </button>
    </div>
  </div>
  <div class="steps">
    <div class="step active" id="s1"><div class="step-dot">1</div><div class="step-lbl">Catalog</div></div>
    <div class="step" id="s2"><div class="step-dot">2</div><div class="step-lbl">Details</div></div>
    <div class="step" id="s3"><div class="step-dot">3</div><div class="step-lbl">Payment</div></div>
  </div>
</div>

<!-- Page 1: Catalog -->
<div class="page on" id="p1">
  <div class="tabs" id="tabs"></div>
  <div id="catSec"></div>
</div>

<!-- Page 2: Details -->
<div class="page" id="p2">
  <div class="sl">Account Details</div>
  <div id="detForms"></div>
  <button class="btn" onclick="goPayment()">Continue to Payment →</button>
  <button class="btn sec" onclick="goCatalog()">← Back to Catalog</button>
</div>

<!-- Page 3: Payment -->
<div class="page" id="p3">
  <div class="sl">Choose Payment Method</div>
  <div class="pm-grid" id="pmGrid"></div>
  <div id="pmDetail"></div>
  <div class="card" id="sumCard" style="margin-bottom:12px"></div>
  <button class="btn" id="submitBtn" style="display:none" onclick="submitOrder()">Place Order</button>
  <button class="btn sec" onclick="goDetails()">← Back</button>
</div>

<!-- Basket sheet -->
<div class="overlay" id="basketOverlay" onclick="if(event.target===this)closeBasket()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">🧺 Your Basket</div>
    <div id="basketItems"></div>
  </div>
</div>

<!-- My Subscriptions sheet -->
<div class="overlay" id="ordersOverlay" onclick="if(event.target===this)closeOrders()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">📋 My Subscriptions</div>
    <div id="ordersContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
tg.setHeaderColor('secondary_bg_color');

// ── Load subscription data from URL query param ──────────────────────
// The bot encodes the user's subscriptions + custom catalog items as
// base64 JSON in the ?subs= query parameter. Using a query param (not
// a fragment #) ensures Telegram always passes it to the WebApp intact.
let SUBS_DATA = null;
try {
  const _subs = new URLSearchParams(window.location.search).get('subs');
  if (_subs) {
    const pad = '=='.slice(0, (4 - _subs.length % 4) % 4);
    const b64 = (_subs + pad).replace(/-/g, '+').replace(/_/g, '/');
    SUBS_DATA  = JSON.parse(atob(b64));
  }
} catch(e) { /* ignore parse errors */ }

// ── Catalog data ──────────────────────────────────────────────────────
const IMD = new Set(['imd_new_6m','imd_new_1y','imd_renew_6m','imd_renew_1y']);

const CATALOG = [
  {id:'uptodate',name:'Uptodate',emoji:'📖',groups:[
    {label:'Online Access',items:[
      {id:'up_online_app',name:'Mobile App',sub:'Online · 1 Year',price:20},
      {id:'up_online_web',name:'Mobile App + Browser',sub:'Online · 1 Year',price:35},
    ]},
    {label:'Online + Offline',items:[
      {id:'up_offline_app',name:'Mobile App',sub:'Offline · 1 Year',price:30},
      {id:'up_offline_web',name:'Mobile App + Browser',sub:'Offline · 1 Year',price:45},
    ]},
    {label:'Online + Pathways',items:[
      {id:'up_pathways_app',name:'Mobile App',sub:'Pathways · 1 Year',price:30},
      {id:'up_pathways_web',name:'Mobile App + Browser',sub:'Pathways · 1 Year',price:45},
    ]},
  ]},
  {id:'amboss',name:'Amboss',emoji:'🧠',groups:[
    {label:'Premium + Library',items:[
      {id:'amboss_premium_1y',name:'1 Year',sub:'Unlimited Qbanks + Library',price:85},
      {id:'amboss_premium_promo',name:'Until 18/9/2026',sub:'Limited offer',price:35},
    ]},
    {label:'Library Only',items:[
      {id:'amboss_library',name:'1 Year',sub:'Limited Qbanks',price:65},
    ]},
  ]},
  {id:'imd',name:'iMD VIP',emoji:'🎓',groups:[
    {label:'New Account',items:[
      {id:'imd_new_6m',name:'6 Months',sub:'New registration',price:50},
      {id:'imd_new_1y',name:'1 Year',sub:'New registration',price:75},
    ]},
    {label:'Renewal',items:[
      {id:'imd_renew_6m',name:'6 Months',sub:'Existing account',price:50},
      {id:'imd_renew_1y',name:'1 Year',sub:'Existing account',price:75},
    ]},
  ]},
  {id:'other',name:'More',emoji:'📚',single:[
    {id:'dynamed',e:'💊',name:'Dynamed',price:20},
    {id:'dynamedex',e:'💊',name:'DynamedEx',price:30},
    {id:'bmj_best_practice',e:'📋',name:'BMJ Best Practice',price:20},
    {id:'bmj_learning',e:'🎓',name:'BMJ Learning',price:30},
    {id:'visualdx',e:'🔬',name:'VisualDx',price:20},
    {id:'lexicomp',e:'💉',name:'Lexicomp Mobile',price:20},
    {id:'accessmedicine',e:'🏥',name:'AccessMedicine',price:20},
    {id:'boardvitals',e:'📝',name:'Boardvitals VIP',price:55},
    {id:'clinicalkey',e:'🔑',name:'ClinicalKey',price:35},
    {id:'sciencedirect',e:'🔭',name:'ScienceDirect',price:35},
    {id:'statdx',e:'📊',name:'StatDx',price:35},
    {id:'nejm',e:'📰',name:'NEJM',price:20},
    {id:'jama_evidence',e:'📰',name:'JAMA Evidence',price:20},
    {id:'scopus',e:'🌐',name:'Scopus',price:35},
    {id:'springerlink',e:'📗',name:'SpringerLink',price:35},
  ]},
];

const IMAP = {};
CATALOG.forEach(c=>{
  if(c.groups) c.groups.forEach(g=>g.items.forEach(i=>IMAP[i.id]=i));
  if(c.single) c.single.forEach(i=>IMAP[i.id]={...i,sub:'1 Year'});
});

// ── Payment data ──────────────────────────────────────────────────────
const FLAGS={Lebanon:'🇱🇧',Jordan:'🇯🇴',India:'🇮🇳',Ghana:'🇬🇭',
  Pakistan:'🇵🇰',Europe:'🇪🇺',USA:'🇺🇸',KSA:'🇸🇦',Russia:'🇷🇺'};

function payInstr(c,t){
  const m={
    Lebanon:`WhishMoney: <span class="mono">81666579</span><br>Amount: <strong>$${t.toFixed(2)}</strong>`,
    Jordan:`<strong>${(t*0.7066).toFixed(1)} JOD</strong><br>CLIQ: <span class="mono">WKS777</span> Orange·Waleed Shaqfeh<br>CLIQ: <span class="mono">WKS999</span> Etihad·Waleed Shaqfeh<br>CLIQ: <span class="mono">WKS555</span> Zain·Shamalti`,
    India:`UPI: <span class="mono">s4005194160889795@slc</span><br>Shilpaben karetiya<br><strong>₹${Math.round(t*94.6666).toLocaleString()}</strong><br>⚠️ Leave remarks empty. Split if needed.`,
    Ghana:`<strong>${(t*11.8).toFixed(2)} GHS</strong><br><span class="mono">0257505632</span> MTN·Saibu Mahamadu<br><span class="mono">0204860754</span> Telecel·Saibu Mahamadu`,
    Pakistan:`<strong>${Math.round(t*280).toLocaleString()} PKR</strong><br>HBL·Muhammad Bilal<br>Acc: <span class="mono">03577900871203</span><br>IBAN: <span class="mono">PK08HABB0003577900871203</span><br>Branch: TOTALAI`,
    Europe:`Revolut card: <span class="mono">5413525250267271</span><br>Alijon Karimov·Tajikistan<br><strong>$${t.toFixed(2)}</strong>`,
    KSA:`<strong>${(t*3.8).toFixed(2)} SAR</strong><br>IBAN: <span class="mono">SA8710000006857309000101</span><br>IBAN: <span class="mono">SA0510000062300187719603</span><br>Ahli Bank·Jamil Hajji<br><strong>Purpose: Friends & family</strong>`,
    Russia:`<strong>${Math.round(t*85.5).toLocaleString()} RUB</strong><br>Sberbank→Int'l→Phone: <span class="mono">+992002373232</span><br>Tajikistan·Alijon Karimov·Alif Bank`,
  };
  return m[c]||`Amount: <strong>$${t.toFixed(2)}</strong>`;
}
const USA_APPS={
  'TapTap Send':`TapTap→Lebanon→Whish Money Wallet<br>Phone: <span class="mono">0096181666579</span><br>Ahmad Safa·1994`,
  'Ria':`App→Lebanon→Purpl<br>Phone: <span class="mono">0096181666579</span><br>Ahmad Safa·Educational·17/09/1994`,
  'Paysend':`App→Lebanon→Purpl<br>Phone: <span class="mono">0096181666579</span><br>Ahmad Safa·Educational·17/09/1994`,
  'Remitly':`App→Lebanon→Purpl<br>Phone: <span class="mono">0096181666579</span><br>Ahmad Safa·Educational·17/09/1994`,
  'Revolut':`Card: <span class="mono">5413525250267271</span><br>Alijon Karimov·Tajikistan`,
};

// ── Cart ──────────────────────────────────────────────────────────────
let cart={};
let selPay=null,selCountry=null,selApp=null;
const cartTotal=()=>Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0);
const cartSize =()=>Object.values(cart).reduce((s,i)=>s+i.qty,0);

function addItem(id){
  const itm=IMAP[id]; if(!itm) return;
  cart[id]=cart[id]?{...cart[id],qty:cart[id].qty+1}:{name:itm.name,price:itm.price,qty:1};
  const btn=document.getElementById('ab-'+id);
  if(btn){btn.textContent='✓';btn.classList.add('in');}
  syncBasket(); showToast('Added · $'+itm.price);
}
function removeItem(id){delete cart[id]; syncBasket(); renderBasket();}

function syncBasket(){
  const n=cartSize();
  const bc=document.getElementById('bc');
  bc.textContent=n; bc.classList.toggle('vis',n>0);
}

// ── My Subscriptions sheet ────────────────────────────────────────────
function openOrders(){
  renderOrders();
  document.getElementById('ordersOverlay').classList.add('on');
}
function closeOrders(){document.getElementById('ordersOverlay').classList.remove('on')}

function renderOrders(){
  const el=document.getElementById('ordersContent');
  if(!SUBS_DATA){
    el.innerHTML=`<div class="empty-sheet">
      <div class="eico">📋</div>
      <div>No subscription data available.<br>Try closing and reopening the Shop.</div>
    </div>`;
    return;
  }
  const {d=[],p=[]}=SUBS_DATA;
  let html='';

  if(d.length){
    html+=`<div class="sub-section-lbl">✅ Delivered (${d.length})</div>`;
    d.forEach(([name,date])=>{
      html+=`<div class="sub-row">
        <div class="sub-icon">✅</div>
        <div class="sub-info">
          <div class="sub-name">${name}</div>
          ${date?`<div class="sub-meta">${date}</div>`:''}
        </div>
      </div>`;
    });
  }
  if(p.length){
    const stateLabel={needs_info:'⌛ Awaiting your details',awaiting_delivery:'🔄 Being prepared'};
    html+=`<div class="sub-section-lbl">⏳ Pending (${p.length})</div>`;
    p.forEach(([name,state])=>{
      html+=`<div class="sub-row">
        <div class="sub-icon">⏳</div>
        <div class="sub-info">
          <div class="sub-name">${name}</div>
          <div class="sub-meta">${stateLabel[state]||'In progress'}</div>
        </div>
      </div>`;
    });
  }
  if(!html){
    html=`<div class="empty-sheet">
      <div class="eico">📭</div>
      <div>No subscriptions yet.<br>Your orders will appear here after purchase.</div>
    </div>`;
  }
  el.innerHTML=html;
}

// Show the 📋 icon as active if there's data
if(SUBS_DATA&&(SUBS_DATA.d?.length||SUBS_DATA.p?.length)){
  const b=document.getElementById('subsBadge');
  b.style.display='flex'; b.textContent=(SUBS_DATA.d?.length||0)+(SUBS_DATA.p?.length||0);
}

// ── Basket sheet ──────────────────────────────────────────────────────
function openBasket(){renderBasket();document.getElementById('basketOverlay').classList.add('on')}
function closeBasket(){document.getElementById('basketOverlay').classList.remove('on')}

function renderBasket(){
  const el=document.getElementById('basketItems');
  const items=Object.entries(cart);
  if(!items.length){
    el.innerHTML=`<div class="empty-sheet"><div class="eico">🧺</div>Your basket is empty</div>`;
    return;
  }
  el.innerHTML=items.map(([id,{name,price,qty}])=>
    `<div class="ci">
      <div class="ci-name">${name}${qty>1?` ×${qty}`:''}</div>
      <div class="ci-price">$${(price*qty).toFixed(2)}</div>
      <button class="rm" onclick="removeItem('${id}')">×</button>
    </div>`
  ).join('')+
  `<div class="cart-total"><span>Total</span><span>$${cartTotal().toFixed(2)}</span></div>
   <div style="padding:0 15px">
     <button class="btn" onclick="closeBasket();goDetails()">Proceed to Order →</button>
   </div>`;
}

// ── Navigation ────────────────────────────────────────────────────────
function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id))}
function setStep(n){
  [1,2,3].forEach(i=>{
    const el=document.getElementById('s'+i);
    el.classList.toggle('done',i<n); el.classList.toggle('active',i===n);
    el.querySelector('.step-dot').textContent=i<n?'✓':i;
  });
}
function goCatalog(){showPage('p1');setStep(1);document.getElementById('hdrTitle').textContent='Medic SalesBot';tg.MainButton.hide();window.scrollTo(0,0)}
function goDetails(){
  if(!cartSize()){showToast('Add at least one item first');return;}
  closeBasket();buildDetailForms();
  showPage('p2');setStep(2);document.getElementById('hdrTitle').textContent='Account Details';tg.MainButton.hide();window.scrollTo(0,0);
}
function goPayment(){if(!validateDetails())return;buildPaymentPage();showPage('p3');setStep(3);document.getElementById('hdrTitle').textContent='Payment';window.scrollTo(0,0)}

// ── Catalog build ─────────────────────────────────────────────────────
function buildCatalog(){
  const tabsEl=document.getElementById('tabs');
  const secEl=document.getElementById('catSec');
  CATALOG.forEach((cat,ci)=>{
    const tab=document.createElement('button');
    tab.className='tab'+(ci===0?' active':'');
    tab.dataset.catid=cat.id;
    tab.textContent=cat.emoji+' '+cat.name;
    tab.onclick=()=>switchCat(cat.id);
    tabsEl.appendChild(tab);
    const sec=document.createElement('div');
    sec.id='cat-'+cat.id; sec.style.display=ci===0?'block':'none';
    if(cat.groups) cat.groups.forEach(g=>{
      const lbl=document.createElement('div'); lbl.className='sl'; lbl.textContent=g.label; sec.appendChild(lbl);
      const card=document.createElement('div'); card.className='card';
      g.items.forEach(i=>card.appendChild(makeRow(i,false))); sec.appendChild(card);
    });
    if(cat.single){
      const lbl=document.createElement('div'); lbl.className='sl'; lbl.textContent='1 Year Subscriptions'; sec.appendChild(lbl);
      cat.single.forEach(i=>sec.appendChild(makeRow({...i,sub:'1 Year'},true)));
    }
    secEl.appendChild(sec);
  });
}

function makeRow(itm,solo){
  const d=document.createElement('div'); d.className=solo?'solo':'row';
  d.innerHTML=`${solo?`<div style="font-size:21px">${itm.e||'📦'}</div>`:''}
    <div class="ri"><div class="rn">${itm.name}</div><div class="rs">${itm.sub||''}</div></div>
    <div class="rp">$${itm.price}</div>
    <button class="add-btn" id="ab-${itm.id}" onclick="addItem('${itm.id}')">+</button>`;
  return d;
}

// KEY FIX: use data-catid so extra non-catalog tabs can't break iteration
function switchCat(id){
  CATALOG.forEach(c=>{const el=document.getElementById('cat-'+c.id); if(el) el.style.display='none';});
  document.querySelectorAll('.tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.catid===id));
  const el=document.getElementById('cat-'+id); if(el) el.style.display='block';
  window.scrollTo(0,0);
}

// ── Detail forms ──────────────────────────────────────────────────────
function buildDetailForms(){
  const el=document.getElementById('detForms'); el.innerHTML='';
  Object.entries(cart).forEach(([id,{name,price,qty}])=>{for(let q=0;q<qty;q++) el.appendChild(makeDetailBlock(id,name,price,q));});
}
function makeDetailBlock(id,name,price,idx){
  const w=document.createElement('div'); w.className='dblock'; w.dataset.id=id; w.dataset.idx=idx;
  const isIN=id.startsWith('imd_new'), isIR=id.startsWith('imd_renew');
  const lbl=idx>0?` #${idx+1}`:'';
  let body='';
  if(isIN) body=flds(id,idx,[['email','Email','email','Never used for iMD before'],['username','Username','text','≥6 chars'],['password','Password','password','8+ chars, 1 cap, 1 num, one of: - _ . # @']]);
  else if(isIR) body=flds(id,idx,[['prev_username','Existing iMD Username','text','']]);
  else body=`<div class="toggle"><button class="tbtn active" onclick="setType(this,'new','${id}',${idx})">🆕 New</button><button class="tbtn" onclick="setType(this,'renew','${id}',${idx})">🔄 Renewal</button></div><div id="ff-${id}-${idx}">${newFlds(id,idx)}</div>`;
  w.innerHTML=`<div class="dheader"><div class="ri"><div class="rn">${name}${lbl}</div></div><div class="ptag">$${price}</div></div>${body}`;
  return w;
}
const newFlds=(id,idx)=>flds(id,idx,[['first_name','First Name','text',''],['last_name','Last Name','text',''],['email','Email','email','Never used for this subscription before'],['username','Username','text','≥6 chars'],['password','Password','password','8+ chars, 1 cap, 1 num, one of: - _ . # @']]);
const renewFlds=(id,idx)=>flds(id,idx,[['login_username','Username or Email (existing)','text',''],['login_password','Existing Password','password','']]);
function flds(id,idx,list){return'<div class="fields">'+list.map(([n,l,t,h])=>{const fid=`f-${id}-${idx}-${n}`;return`<div class="field"><label for="${fid}">${l}</label><input id="${fid}" name="${n}" type="${t}" autocomplete="off" spellcheck="false">${h?`<div class="fhint">${h}</div>`:''}<div class="ferr" id="e-${fid}"></div></div>`;}).join('')+'</div>';}
function setType(btn,type,id,idx){
  btn.parentElement.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('active',b===btn));
  btn.closest('.dblock').dataset.type=type;
  document.getElementById(`ff-${id}-${idx}`).innerHTML=type==='new'?newFlds(id,idx):renewFlds(id,idx);
}

// ── Validation ────────────────────────────────────────────────────────
function validateDetails(){
  let ok=true;
  document.querySelectorAll('.dblock').forEach(block=>{
    const id=block.dataset.id, idx=parseInt(block.dataset.idx||0);
    const isIN=id.startsWith('imd_new'), isIR=id.startsWith('imd_renew');
    const type=block.dataset.type||(isIN?'new':isIR?'renew':'new');
    block.querySelectorAll('input').forEach(inp=>{
      const n=inp.name,v=inp.value.trim();
      const fe=document.getElementById('e-'+inp.id);
      inp.classList.remove('err'); if(fe) fe.textContent='';
      if(!v){setErr(inp,'Required');ok=false;return;}
      if(n==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){setErr(inp,'Enter a valid email');ok=false;return;}
      if(n==='username'&&v.length<6){setErr(inp,'At least 6 characters');ok=false;return;}
      if((n==='password'||n==='login_password')&&type==='new'){
        if(v.length<8){setErr(inp,'At least 8 characters');ok=false;return;}
        if(!/[A-Z]/.test(v)){setErr(inp,'Need a capital letter');ok=false;return;}
        if(!/[0-9]/.test(v)){setErr(inp,'Need a number');ok=false;return;}
        if(!/[-_.#@]/.test(v)){setErr(inp,'Need a symbol: - _ . # @');ok=false;return;}
      }
    });
  });
  if(!ok) showToast('Fix highlighted fields');
  return ok;
}
function setErr(inp,msg){inp.classList.add('err');const el=document.getElementById('e-'+inp.id);if(el)el.textContent=msg;}

// ── Payment page ──────────────────────────────────────────────────────
function buildPaymentPage(){
  const total=cartTotal();
  [{id:'stars',ico:'⭐',lbl:'Telegram Stars',sub:'Pay with Stars'},
   {id:'credits',ico:'🎁',lbl:'My Credits',sub:'Use earned credits'},
   {id:'card',ico:'💳',lbl:'Visa/Mastercard',sub:'Pay online'},
   {id:'local',ico:'🌍',lbl:'Local Transfer',sub:'9 countries'},
   {id:'crypto',ico:'₿',lbl:'Cryptocurrency',sub:'USDT, BTC, more'},
  ].forEach(m=>{
    const d=document.createElement('div'); d.className='pm'; d.dataset.id=m.id;
    d.innerHTML=`<div class="ico">${m.ico}</div><div class="lbl">${m.lbl}</div><div class="sub">${m.sub}</div>`;
    d.onclick=()=>selMethod(m.id,total);
    document.getElementById('pmGrid').appendChild(d);
  });
  const sc=document.getElementById('sumCard');
  sc.innerHTML=Object.entries(cart).map(([id,{name,price,qty}])=>
    `<div class="sumrow"><div>${name}${qty>1?` ×${qty}`:''}</div><div class="r">$${(price*qty).toFixed(2)}</div></div>`
  ).join('')+`<div class="sumrow"><div>Total</div><div class="r">$${total.toFixed(2)}</div></div>`;
  selPay=null;selCountry=null;selApp=null;
  document.getElementById('pmDetail').innerHTML='';
  document.getElementById('submitBtn').style.display='none';
}

function selMethod(id,total){
  selPay=id; selCountry=null; selApp=null;
  document.querySelectorAll('.pm').forEach(c=>c.classList.toggle('sel',c.dataset.id===id));
  const det=document.getElementById('pmDetail'), sub=document.getElementById('submitBtn');
  if(id==='stars'){
    det.innerHTML=`<div class="pdtl on">⭐ You'll receive a Stars invoice after placing the order.</div>`;
    sub.textContent='Place Order → Pay with Stars ⭐'; sub.style.display='block';
  }else if(id==='credits'){
    det.innerHTML=`<div class="pdtl on">🎁 ${Math.ceil(total/4)} credits needed ($4 each). If insufficient, the bot will let you know.</div>`;
    sub.textContent='Pay with Credits 🎁'; sub.style.display='block';
  }else if(id==='card'){
    det.innerHTML=`<div class="pdtl on">1. <a href="https://payments.suyool.com/pay/g401_MD" target="_blank" style="color:var(--teal2)">Open Payment Link ↗</a><br>2. "Pay online with your card"<br>3. From: your name · Amount: <strong>$${total.toFixed(2)}</strong> · Message: empty<br>4. Enter card details and complete</div>`;
    sub.textContent="I've Paid ✅"; sub.style.display='block';
  }else if(id==='local'){
    const countries=Object.keys(FLAGS);
    det.innerHTML=`<div class="sl" style="margin-top:0">Select your country</div><div class="cg">${countries.map(c=>`<div class="cb" data-c="${c}" onclick="selCountryFn('${c}',${total})">${FLAGS[c]} ${c}</div>`).join('')}</div><div id="lclDtl"></div>`;
    sub.style.display='none';
  }else if(id==='crypto'){
    det.innerHTML=`<div class="pdtl on"><strong>USDT BEP20:</strong><br><span class="mono">0x4ccff0e89e4ee00e96ae6e15e3b5e12fa0c66b20</span><br><br><strong>USDT TRC20:</strong><br><span class="mono">TBdXHpNMWsGDUTeTCBQkbJzamxvgW2hHyj</span><br><br><strong>BTC:</strong><br><span class="mono">bc1q2ccf4yzptwtdmnfdwuphvefmksy4ry2lylfhrj</span><br><br><strong>Bybit/OKX/BingX UID:</strong> <span class="mono">306834837</span><br><br>Amount: <strong>$${total.toFixed(2)}</strong></div>`;
    sub.textContent="I've Paid ✅"; sub.style.display='block';
  }
}
function selCountryFn(c,total){
  selCountry=c; selApp=null;
  document.querySelectorAll('.cb').forEach(b=>b.classList.toggle('sel',b.dataset&&b.dataset.c===c));
  const det=document.getElementById('lclDtl');
  if(c==='USA'){
    det.innerHTML=`<div class="sl">Choose app</div><div class="cg">${Object.keys(USA_APPS).map(a=>`<div class="cb" data-a="${a}" onclick="selAppFn('${a}')">${a}</div>`).join('')}</div><div id="appDtl"></div>`;
    document.getElementById('submitBtn').style.display='none';
  }else{
    det.innerHTML=`<div class="pdtl on">${payInstr(c,total)}</div>`;
    const sub=document.getElementById('submitBtn'); sub.textContent="I've Paid ✅"; sub.style.display='block';
  }
}
function selAppFn(a){
  selApp=a;
  document.querySelectorAll('[data-a]').forEach(b=>b.classList.toggle('sel',b.dataset.a===a));
  const total=cartTotal();
  document.getElementById('appDtl').innerHTML=`<div class="pdtl on">${USA_APPS[a]||''}<br><br>Amount: <strong>$${total.toFixed(2)}</strong></div>`;
  const sub=document.getElementById('submitBtn'); sub.textContent="I've Paid ✅"; sub.style.display='block';
}

// ── Submit order ──────────────────────────────────────────────────────
function collectDetails(){
  const out=[];
  document.querySelectorAll('.dblock').forEach(block=>{
    const id=block.dataset.id, idx=parseInt(block.dataset.idx||0);
    const isIN=id.startsWith('imd_new'), isIR=id.startsWith('imd_renew');
    const type=block.dataset.type||(isIN?'new':isIR?'renew':'new');
    const entry={id,account_type:type};
    block.querySelectorAll('input').forEach(inp=>{if(inp.value.trim()) entry[inp.name]=inp.value.trim();});
    out.push(entry);
  });
  return out;
}
function submitOrder(){
  if(!selPay){showToast('Choose a payment method');return;}
  if(selPay==='local'&&!selCountry){showToast('Choose your country');return;}
  if(selPay==='local'&&selCountry==='USA'&&!selApp){showToast('Choose a transfer app');return;}
  let pay=selPay;
  if(selPay==='local') pay=selCountry+(selApp?' — '+selApp:'');
  tg.sendData(JSON.stringify({action:'full_order',items:collectDetails(),payment_method:pay,total:cartTotal()}));
}

// ── Toast ─────────────────────────────────────────────────────────────
let _tt;
function showToast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove('on'),1900);
}

// ── Main button ───────────────────────────────────────────────────────
tg.MainButton.onClick(submitOrder);

// ── Init ──────────────────────────────────────────────────────────────
buildCatalog();

// Inject any custom admin-added subscriptions into the "More" section
if (SUBS_DATA && SUBS_DATA.c && SUBS_DATA.c.length) {
  const moreSec = document.getElementById('cat-other');
  if (moreSec) {
    const lbl = document.createElement('div');
    lbl.className = 'sl'; lbl.textContent = 'Additional Subscriptions';
    moreSec.appendChild(lbl);
    SUBS_DATA.c.forEach(([name, price]) => {
      const fakeId = 'custom_' + name.replace(/\W+/g,'_').toLowerCase();
      // Register in IMAP so addItem can find it
      IMAP[fakeId] = {id: fakeId, name, price, sub: ''};
      const row = makeRow({id: fakeId, name, price, sub: '', e: '📦'}, true);
      moreSec.appendChild(row);
    });
  }
}
</script>
